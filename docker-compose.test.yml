# Docker Compose for E2E Testing
# 
# Usage: docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from playwright
#
# The frontend container includes WASM (compiled from Go) - no separate API needed.
# E2E tests exercise the browser-based WASM solver, as users experience it.

services:
  # Sudoku app (nginx serving built app with WASM)
  sudoku:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "4173:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Playwright E2E test runner.
  # The mcr.microsoft.com/playwright:vN-noble image SHIPS browsers pre-installed
  # at /ms-playwright. Do NOT set PLAYWRIGHT_BROWSERS_PATH and do NOT run
  # `npx playwright install`: doing so forces a re-download into a root-owned
  # cache dir, which the non-root container cannot write to (EACCES) and which
  # previously caused the suite to hang on download.
  #
  # Ownership contract: runs as ${DOCKER_USER}, defaulting to root (0:0, the
  # image default). CI invokes this file directly without setting DOCKER_USER
  # and keeps the root default. The Makefile test targets pass
  # DOCKER_USER="$(id -u):$(id -g)" so local runs leave user-owned artifacts
  # in the bind-mounted frontend/ tree instead of root-owned ones that later
  # break `npx playwright test` (EACCES on test-results/.last-run.json).
  # Do NOT replace this with `user: "${UID}:${GID}"`: UID/GID are unexported
  # shell variables, so compose cannot see them; on a CI runner with UID 1001
  # any hardcoded fallback mismatches and mkdir /app/allure-results fails.
  playwright:
    # Digest-pinned so a rebuilt :v1.61.1-noble cannot shift under us; the
    # pre-installed browsers at /ms-playwright must match the Playwright npm
    # version. Dependabot proposes digest bumps under review.
    image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
    working_dir: /app
    user: "${DOCKER_USER:-0:0}"
    volumes:
      - ./frontend:/app
    depends_on:
      sudoku:
        condition: service_healthy
    environment:
      - PLAYWRIGHT_BASE_URL=http://sudoku:80
      - CI=true
      - HOME=/tmp
      # Aggregate make targets clean allure-results once up front and set this
      # so per-suite global setups do not wipe earlier suites' results.
      # Empty (the default) means each suite cleans its own results at start.
      - ALLURE_SKIP_CLEAN=${ALLURE_SKIP_CLEAN:-}
    command: >
      sh -c "
        mkdir -p /app/allure-results &&
        npm ci &&
        npx playwright test --project=chrome-desktop --grep-invert @profiling --grep-invert @slow --grep-invert @performance
      "
