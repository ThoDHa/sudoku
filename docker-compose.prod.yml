services:
  sudoku:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
