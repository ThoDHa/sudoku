<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content-Security-Policy (mirrors the nginx header in nginx.conf).
      GitHub Pages cannot set HTTP response headers, so the CSP is delivered
      via this meta tag on the Pages deploy. Place it before any script/style
      so it governs everything below.

      The 'sha256-...' source permits the inline BFCache recovery script
      further down in <head>. If that script is edited, recompute its sha256
      over the trimmed text of the inline script element and update the hash
      here AND in frontend/nginx.conf ($csp), or the browser will block it.

      Note: <meta> CSP cannot enforce frame-ancestors, sandbox, or report-uri
      (browsers ignore those directives here). Clickjacking protection on the
      Pages path is therefore unavailable; the nginx path uses both this CSP
      and X-Frame-Options: DENY.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3b82f6" />
    <meta
      name="description"
      content="Learn Sudoku solving techniques with an educational puzzle app"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sudoku" />
    <title>Sudoku</title>
    <!-- BFCache recovery overlay removed: the inline script was blocked by CSP (script-src disallows
    inline). window.__markAppReady?.() in main.tsx is a safe no-op. Re-add as an external /recovery.js if needed. -->
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
