server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Ensure proper MIME types are available (include common types and wasm)
    include /etc/nginx/mime.types;

    # Content-Security-Policy, defined once so every location references an
    # identical policy. This string is mirrored verbatim in index.html's
    # <meta http-equiv="Content-Security-Policy"> for the GitHub Pages deploy.
    # The 'sha256-...' permits the inline BFCache recovery script in
    # index.html; if that script changes, recompute its sha256 and update it
    # here AND in index.html.
    set $csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-7t2CYch7Zw/v7PiBxoM2z9QJMJZJQZP78LC1dx7jYZQ='; worker-src 'self' blob:; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    # Security response headers, applied to every response via `always` (so
    # 4xx/5xx bodies are hardened too). nginx does NOT inherit add_header into
    # a location that declares its own add_header, so locations that set a
    # Cache-Control (/assets, = /index.html, = /sw.js) repeat this block below.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy $csp always;

    # Compress text-based assets (JS/CSS/JSON/SVG/wasm). WASM compresses
    # well (~630KB -> ~228KB); all evergreen browsers accept gzipped wasm
    # when served with the correct Content-Type above.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

    # Serve static files with SPA fallback. Inherits the server-level
    # security headers (no add_header at this level).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The HTML shell and service worker must always revalidate so a new deploy
    # is picked up immediately (no stale shell referencing rotated asset
    # hashes). `no-cache` allows fast 304s when unchanged. Exact-match
    # locations take precedence over the SPA fallback, and the internal
    # rewrite to /index.html from try_files re-matches this location.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy $csp always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy $csp always;
    }

    # Cache static assets. Repeats the security headers because the
    # Cache-Control add_header below drops server-level inheritance.
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy $csp always;
    }

    # Serve all .wasm files with correct MIME type. Inherits the server-level
    # security headers (no add_header at this level).
    location ~ \.wasm$ {
        default_type application/wasm;
        expires 1d;
    }

    # Health check for container orchestration. Uses default_type (not
    # add_header Content-Type) so this location inherits the server-level
    # security headers without repeating them.
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }
}
