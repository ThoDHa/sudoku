server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Ensure proper MIME types are available (include common types and wasm)
    include /etc/nginx/mime.types;

    # Compress text-based assets (JS/CSS/JSON/SVG/wasm). WASM compresses
    # well (~630KB -> ~228KB); all evergreen browsers accept gzipped wasm
    # when served with the correct Content-Type above.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

    # Serve static files with SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Serve all .wasm files with correct MIME type
    location ~ \.wasm$ {
        default_type application/wasm;
        expires 1d;
    }

    # Health check for container orchestration
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
