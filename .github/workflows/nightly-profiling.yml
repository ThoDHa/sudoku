name: Profiling Gate

# Weekly gate for the profiling suite. Kept separate from deploy.yml
# (per-commit gates) because the suite is slow (~15-20m for memory, ~10m for
# wasm-cpu) and environment-sensitive; only the wasm-cpu verdict is a hard
# gate. The changes-within-window job decides per run between running the
# suite (main moved in the last 7 days), refreshing the report artifacts
# (quiet tree, but the artifacts would expire before the next scheduled run
# could re-publish them), or skipping.
#
# Fail policy (Option A):
#   - Cycle 1 (hard gate): wasm-cpu-profile.spec.ts verdict FAIL fails the job.
#   - Cycle 2 (informational, continue-on-error): env-sensitive thresholds
#     (absolute-ms latency, heap growth) warn but do not fail the job.
# Baselines are gitignored (frontend/e2e/profiling/results/), so uploaded
# artifacts are the record of each run.

on:
  workflow_dispatch:
  schedule:
    # Mondays 04:05 UTC, offset from the 04:00 mutation nightly so the two
    # long jobs never contend for the same window.
    - cron: "5 4 * * 1"

permissions:
  contents: read
  actions: read

# Distinct from deploy.yml's "deploy-${{ github.ref }}" group so a nightly
# run never cancels (and is never cancelled by) a deploy run.
concurrency:
  group: nightly-profiling
  cancel-in-progress: true

env:
  CI: true

jobs:
  changes-within-window:
    # Scheduled runs fire regardless of repo activity, but profiling an
    # unchanged tree produces no new signal and burns a 25-30m runner. The
    # gate decides between three modes:
    #   - run: main's head committer timestamp is within the last 7 days
    #     (pushes to this repo land as merge commits, so the committer date
    #     tracks the push, not the original authoring) -> run the suite.
    #   - refresh: the tree is quiet but the latest successful run's
    #     artifacts expire within the next 7 days (they live 30), i.e.
    #     before the next scheduled run could refresh them. Artifacts cannot
    #     be marked do-not-expire and their retention cannot be extended, so
    #     the refresh job re-uploads the still-live artifacts under a fresh
    #     30-day window in a successful run of this workflow (~2m runner)
    #     instead of re-running the suite, keeping the report portal's
    #     profiling section alive without paying for unchanged signal.
    #   - skip: quiet tree, artifacts outlive the next scheduled run.
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.window.outputs.mode }}
    steps:
      - name: Checkout main head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Decide run / refresh / skip
        id: window
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          last_commit=$(git log -1 --format=%ct)
          cutoff=$(( $(date +%s) - 7*24*60*60 ))
          if [ "$last_commit" -ge "$cutoff" ]; then
            echo "main moved within the window (last commit $(date -u -d @"$last_commit")); running the profiling suite"
            echo "mode=run" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          next_run_cutoff=$(( $(date +%s) + 7*24*60*60 ))
          run_id=$(gh run list --workflow=nightly-profiling.yml --status=success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run_id" ]; then
            earliest_expiry=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
              --jq '[.artifacts[] | select(.expired == false) | .expires_at] | min // ""')
            if [ -n "$earliest_expiry" ] && \
               [ "$(date -u -d "$earliest_expiry" +%s)" -ge "$next_run_cutoff" ]; then
              echo "main has been quiet since $(date -u -d @"$last_commit") and the artifacts from run $run_id live until $earliest_expiry, past the next scheduled run; skipping"
              echo "mode=skip" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "tree is quiet but the artifacts (run ${run_id:-none}) expire before the next scheduled run; refreshing them"
          echo "mode=refresh" >> "$GITHUB_OUTPUT"
          echo "run_id=${run_id:-}" >> "$GITHUB_OUTPUT"

  refresh-artifacts:
    # Re-publishes the still-live artifacts from the source run under a
    # fresh 30-day window. GitHub offers no do-not-expire flag and no
    # retention extension, so re-uploading in a new successful run of this
    # workflow is the only way to keep the deploy's latest-successful-run
    # fetch working on a quiet repo. The artifact names are fixed, so each
    # gets its own upload step; missing ones fail soft (the portal generator
    # omits sections whose artifacts never existed).
    needs: [changes-within-window]
    if: needs.changes-within-window.outputs.mode == 'refresh'
    runs-on: ubuntu-latest
    steps:
      - name: Download the source run's artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ needs.changes-within-window.outputs.run_id }}
        run: |
          set -eu
          mkdir -p refreshed
          gh run download "$SOURCE_RUN" --dir refreshed

      - name: Refresh nightly-profiling-results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-profiling-results
          path: refreshed/nightly-profiling-results/
          retention-days: 30
        continue-on-error: true

      - name: Refresh nightly-playwright-report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-playwright-report
          path: refreshed/nightly-playwright-report/
          retention-days: 30
        continue-on-error: true

      - name: Refresh nightly-test-results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-test-results
          path: refreshed/nightly-test-results/
          retention-days: 30
        continue-on-error: true

      - name: Refresh nightly-allure-results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-allure-results
          path: refreshed/nightly-allure-results/
          retention-days: 30
        continue-on-error: true

  nightly-profiling:
    needs: [changes-within-window]
    if: needs.changes-within-window.outputs.mode == 'run'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Docker buildx
        # buildx cache lets the built `sudoku` image be reused across both
        # compose cycles, so the second `up` does not rebuild the app image.
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Show Docker Compose version
        run: docker compose version

      # ============================================================
      # Cycle 1 - HARD GATE (verdict FAIL fails the job)
      # ============================================================
      # Only wasm-cpu-profile.spec.ts carries a PASS/WARN/FAIL verdict tier.
      # Its asserted `expect(report.analysis.verdict).not.toBe('FAIL')`
      # is the regression gate. The env-sensitive absolute thresholds live in
      # the other specs and are isolated to Cycle 2.
      #
      # The override rewrites ONLY playwright.command, inheriting every other
      # base service setting (healthcheck, volumes, env, depends_on, user).
      # This coupling to docker-compose.test.yml is intentional: if the base
      # service name or command shape changes, this override must be updated.
      # Crucially the override passes NO --grep-invert flags, so the
      # @profiling/@slow/@performance tags do NOT exclude these specs here.
      - name: Write cycle-1 compose override (hard gate)
        run: |
          cat > docker-compose.nightly-cycle1.yml <<'EOF'
          services:
            playwright:
              command: sh -c "mkdir -p /app/allure-results && npm ci && npx playwright test e2e/profiling/wasm-cpu-profile.spec.ts --project=chrome-desktop --workers=1"
          EOF

      - name: Cycle 1 - verdict gate (hard fail on verdict FAIL)
        run: |
          docker compose -f docker-compose.test.yml -f docker-compose.nightly-cycle1.yml up --build --abort-on-container-exit --exit-code-from playwright

      # ============================================================
      # Cycle 2 - INFORMATIONAL (threshold breaches warn, not fail)
      # ============================================================
      # Runs the environment-sensitive specs under continue-on-error so a
      # breach surfaces in the uploaded artifacts and step annotation without
      # failing the job. Runs even if Cycle 1 failed (if: always()) so a full
      # nightly picture is always collected. The three specs are listed
      # explicitly (not the e2e/profiling/ directory) to avoid re-running
      # wasm-cpu-profile, which Cycle 1 already gated. No --grep-invert flags.
      - name: Write cycle-2 compose override (informational)
        if: always()
        run: |
          cat > docker-compose.nightly-cycle2.yml <<'EOF'
          services:
            playwright:
              command: sh -c "mkdir -p /app/allure-results && npm ci && npx playwright test e2e/profiling/memory-profile.spec.ts e2e/profiling/gap-coverage.spec.ts e2e/profiling/selection-performance.spec.ts --project=chrome-desktop --workers=1"
          EOF

      - name: Cycle 2 - informational thresholds
        if: always()
        continue-on-error: true
        run: |
          docker compose -f docker-compose.test.yml -f docker-compose.nightly-cycle2.yml up --build --abort-on-container-exit --exit-code-from playwright

      # ============================================================
      # Artifacts - baselines are gitignored, artifacts are the record
      # ============================================================
      - name: Upload profiling baselines (results JSON)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-profiling-results
          path: frontend/e2e/profiling/results/
          retention-days: 30

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Upload Playwright test-results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-test-results
          path: frontend/test-results/
          retention-days: 30
          # Playwright only writes test-results/ for failures (traces/screenshots/
          # videos). On a green run it is empty, which is the healthy case, so an
          # empty upload is not worth a warning.
          if-no-files-found: ignore

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-allure-results
          path: frontend/allure-results/
          retention-days: 30

      # ============================================================
      # Cleanup - remove inline override files
      # ============================================================
      - name: Remove inline override files
        if: always()
        run: |
          rm -f docker-compose.nightly-cycle1.yml docker-compose.nightly-cycle2.yml
