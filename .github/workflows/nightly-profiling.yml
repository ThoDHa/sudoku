name: Profiling Gate

# Weekly gate for the profiling suite, run only when `main` moved in the last
# 7 days. PROF-001 moved the wasm-cpu-profile verdict to an ASSERTED
# PASS/WARN/FAIL tier. This workflow is intentionally separate from deploy.yml
# (per-commit gates): the profiling suite is slow (~15-20m for memory, ~10m
# for wasm-cpu) and environment-sensitive. It originally ran only on manual
# dispatch, which left the report portal without a profiling section once the
# last run's artifacts passed their 30-day retention (INFRA-15); the weekly
# schedule keeps fresh artifacts flowing whenever the code is actually
# changing, and the changes-within-window job skips the run entirely when
# `main` has been quiet for a week.
#
# Fail policy (Option A):
#   - Cycle 1 (hard gate): wasm-cpu-profile.spec.ts verdict FAIL fails the job.
#   - Cycle 2 (informational, continue-on-error): env-sensitive thresholds
#     (absolute-ms latency, heap growth) warn but do not fail the job.
# Baselines are gitignored (frontend/e2e/profiling/results/), so uploaded
# artifacts are the record of each run.

on:
  workflow_dispatch:
  schedule:
    # Mondays 04:05 UTC, offset from the 04:00 mutation nightly so the two
    # long jobs never contend for the same window.
    - cron: '5 4 * * 1'

permissions:
  contents: read
  actions: read

# Distinct from deploy.yml's "deploy-${{ github.ref }}" group so a nightly
# run never cancels (and is never cancelled by) a deploy run.
concurrency:
  group: nightly-profiling
  cancel-in-progress: true

env:
  CI: true

jobs:
  changes-within-window:
    # Scheduled runs fire regardless of repo activity, but profiling an
    # unchanged tree produces no new signal and burns a 25-30m runner. The
    # gate runs the suite when EITHER holds:
    #   - main's head committer timestamp is within the last 7 days (pushes
    #     to this repo land as merge commits, so the committer date tracks
    #     the push, not the original authoring), OR
    #   - the latest successful run of this workflow has no live artifacts
    #     anymore (they expire after 30 days), so the report portal would
    #     otherwise silently lose its profiling section (INFRA-15).
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.window.outputs.should-run }}
    steps:
      - name: Checkout main head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Check for recent changes or expired artifacts
        id: window
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          last_commit=$(git log -1 --format=%ct)
          cutoff=$(( $(date +%s) - 7*24*60*60 ))
          if [ "$last_commit" -ge "$cutoff" ]; then
            echo "main moved within the window (last commit $(date -u -d @"$last_commit")); running the profiling suite"
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run_id=$(gh run list --workflow=nightly-profiling.yml --status=success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          live_artifacts=0
          if [ -n "$run_id" ]; then
            live_artifacts=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
              --jq '[.artifacts[] | select(.expired == false)] | length')
          fi
          if [ "$live_artifacts" -eq 0 ]; then
            echo "no live profiling artifacts remain (run ${run_id:-none}); running the profiling suite to restore the portal section"
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          else
            echo "main has been quiet since $(date -u -d @"$last_commit") and run $run_id still has $live_artifacts live artifacts; skipping"
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          fi

  nightly-profiling:
    needs: [changes-within-window]
    if: needs.changes-within-window.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Docker buildx
        # buildx cache lets the built `sudoku` image be reused across both
        # compose cycles, so the second `up` does not rebuild the app image.
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Show Docker Compose version
        run: docker compose version

      # ============================================================
      # Cycle 1 - HARD GATE (verdict FAIL fails the job)
      # ============================================================
      # Only wasm-cpu-profile.spec.ts carries a PASS/WARN/FAIL verdict tier
      # (PROF-001). Its asserted `expect(report.analysis.verdict).not.toBe('FAIL')`
      # is the regression gate. The env-sensitive absolute thresholds live in
      # the other specs and are isolated to Cycle 2.
      #
      # The override rewrites ONLY playwright.command, inheriting every other
      # base service setting (healthcheck, volumes, env, depends_on, user).
      # This coupling to docker-compose.test.yml is intentional: if the base
      # service name or command shape changes, this override must be updated.
      # Crucially the override passes NO --grep-invert flags, so the
      # @profiling/@slow/@performance tags do NOT exclude these specs here.
      - name: Write cycle-1 compose override (hard gate)
        run: |
          cat > docker-compose.nightly-cycle1.yml <<'EOF'
          services:
            playwright:
              command: sh -c "mkdir -p /app/allure-results && npm ci && npx playwright test e2e/profiling/wasm-cpu-profile.spec.ts --project=chrome-desktop --workers=1"
          EOF

      - name: Cycle 1 - verdict gate (hard fail on verdict FAIL)
        run: |
          docker compose -f docker-compose.test.yml -f docker-compose.nightly-cycle1.yml up --build --abort-on-container-exit --exit-code-from playwright

      # ============================================================
      # Cycle 2 - INFORMATIONAL (threshold breaches warn, not fail)
      # ============================================================
      # Runs the environment-sensitive specs under continue-on-error so a
      # breach surfaces in the uploaded artifacts and step annotation without
      # failing the job. Runs even if Cycle 1 failed (if: always()) so a full
      # nightly picture is always collected. The three specs are listed
      # explicitly (not the e2e/profiling/ directory) to avoid re-running
      # wasm-cpu-profile, which Cycle 1 already gated. No --grep-invert flags.
      - name: Write cycle-2 compose override (informational)
        if: always()
        run: |
          cat > docker-compose.nightly-cycle2.yml <<'EOF'
          services:
            playwright:
              command: sh -c "mkdir -p /app/allure-results && npm ci && npx playwright test e2e/profiling/memory-profile.spec.ts e2e/profiling/gap-coverage.spec.ts e2e/profiling/selection-performance.spec.ts --project=chrome-desktop --workers=1"
          EOF

      - name: Cycle 2 - informational thresholds
        if: always()
        continue-on-error: true
        run: |
          docker compose -f docker-compose.test.yml -f docker-compose.nightly-cycle2.yml up --build --abort-on-container-exit --exit-code-from playwright

      # ============================================================
      # Artifacts - baselines are gitignored, artifacts are the record
      # ============================================================
      - name: Upload profiling baselines (results JSON)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-profiling-results
          path: frontend/e2e/profiling/results/
          retention-days: 30

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Upload Playwright test-results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-test-results
          path: frontend/test-results/
          retention-days: 30
          # Playwright only writes test-results/ for failures (traces/screenshots/
          # videos). On a green run it is empty, which is the healthy case, so an
          # empty upload is not worth a warning.
          if-no-files-found: ignore

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-allure-results
          path: frontend/allure-results/
          retention-days: 30

      # ============================================================
      # Cleanup - remove inline override files
      # ============================================================
      - name: Remove inline override files
        if: always()
        run: |
          rm -f docker-compose.nightly-cycle1.yml docker-compose.nightly-cycle2.yml
