name: Mutation Testing

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Which scope to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - frontend
          - go
  schedule:
    # 04:00 UTC daily (one hour after nightly-profiling at 03:00 to avoid contention).
    # Re-enabled: ARCH-2 quarantined transport/http and coverage/mutation baselines are green.
    - cron: "0 4 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: mutation-testing
  cancel-in-progress: false

env:
  CI: true
  # Per-mutant `go test` timeout for go-mutesting, mirroring
  # MUTATION_EXEC_TIMEOUT in api/Makefile. Must exceed the slowest in-scope
  # suite: the tool maps a non-zero `go test` exit to "killed", so a mutant
  # that outlives the budget is scored as killed by its own timeout panic
  # rather than by any test. The tool's 10s default sits below every scoped
  # suite (dp ~75s, techniques ~33s, human ~22s) and silently converted
  # surviving mutants into kills.
  MUTATION_EXEC_TIMEOUT: 300
  # Address-space cap (KB) applied via `ulimit -v` to the whole go-mutesting
  # invocation, mirroring MUTATION_ADDRESS_SPACE_KB in api/Makefile. Some
  # mutants turn a bounded loop into unbounded allocation: mutating the AIC
  # BFS dequeue from `queue = queue[1:]` to `queue[0:]` reaches 5.5 GB in 50s,
  # which exhausts a hosted runner and takes the runner agent down with it
  # (exit 143 followed by "The runner has received a shutdown signal"). Under
  # this cap the same mutant dies alone as a Go runtime out-of-memory at
  # 1.3 GB in 6s, so `go test` exits non-zero and the mutant is correctly
  # scored killed. Measured headroom is roughly tenfold: the honest techniques
  # suite peaks at 90 MB resident and a full `-a` rebuild at 292 MB.
  # GOMEMLIMIT is not a substitute; being a soft limit it raised the peak to
  # 6.2 GB and doubled the runtime instead of stopping the growth.
  MUTATION_ADDRESS_SPACE_KB: 3000000

jobs:
  # Nightly runs fire regardless of repo activity, but this workflow is the
  # most expensive thing the repo schedules (hours across the shard matrix)
  # and mutating an unchanged tree reproduces the previous run's numbers
  # exactly. The gate runs the suite when EITHER holds:
  #   - main's head differs from the latest successful run's head (skip only
  #     when the exact tree was already mutated), OR
  #   - that run's artifacts expire within the next 2 days (they live 30),
  #     before the next nightly could refresh them; a quiet repo followed by
  #     any push would otherwise deploy a portal whose mutation section is
  #     silently omitted. The 2-day window is the nightly cadence plus one
  #     day of slack for cron/expiry timing edges. Unlike profiling (fixed
  #     artifact names, refreshed by a cheap re-upload job), mutation's
  #     matrix-generated artifact names make re-upload unwieldy, so this leg
  #     re-runs the suite; on a public repo the minutes are free and the
  #     trigger is at most monthly. Manual dispatches always run (they carry
  #     an explicit scope choice).
  changes-since-last-run:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.changes.outputs.should-run }}
    steps:
      - name: Check for new commits or artifacts expiring before the next run
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manual dispatch; running"
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head=$(gh api repos/${GITHUB_REPOSITORY}/commits/main --jq .sha)
          last_run=$(gh run list --workflow=nightly-mutation.yml --status=success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          last_sha=$(gh run list --workflow=nightly-mutation.yml --status=success \
            --limit 1 --json headSha --jq '.[0].headSha // empty')
          if [ -z "$last_sha" ] || [ "$last_sha" != "$head" ]; then
            echo "main moved since the last successful run (${last_sha:-none} -> $head); running"
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          expiry_cutoff=$(( $(date +%s) + 2*24*60*60 ))
          refresh_needed=1
          if [ -n "$last_run" ]; then
            earliest_expiry=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${last_run}/artifacts" \
              --jq '[.artifacts[] | select(.expired == false) | .expires_at] | min // ""')
            if [ -n "$earliest_expiry" ] && \
               [ "$(date -u -d "$earliest_expiry" +%s)" -ge "$expiry_cutoff" ]; then
              refresh_needed=0
              echo "head $head was already mutated and its artifacts live until $earliest_expiry, past the next nightly; skipping"
            fi
          fi
          if [ "$refresh_needed" -eq 1 ]; then
            echo "mutation artifacts are missing or expire before the next nightly; running to keep the portal section live"
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          fi

  # The whole surface cannot be mutated in one job. Instrumenting all 65 files
  # inserts 6302 mutant switches, and src/lib carries solver and board code
  # called in tight loops, so the INITIAL TEST RUN ALONE exceeded two hours on a
  # hosted runner while the uninstrumented suite takes ~170s (run 31353467288).
  # Sharding one file per job instruments a single file, which keeps each
  # shard's initial run close to that uninstrumented figure. Same reasoning as
  # the techniques and hooks matrices; public repo, so hosted minutes are free
  # and fine-grained sharding costs nothing.
  #
  # The shard list is derived, never hand-maintained: scripts/mutation_shards.py
  # expands stryker.config.json's own mutate globs and subtracts the hooks the
  # matrix below already covers, reading those names out of this same file. A
  # new src/lib or src/hooks file therefore gets a shard the day it lands, and
  # the two jobs cannot double-count a file.
  frontend-surface-matrix:
    name: Frontend - surface (shard list)
    runs-on: ubuntu-latest
    needs: [changes-since-last-run]
    if: needs.changes-since-last-run.outputs.should-run == 'true'
    if: github.event_name == 'schedule' || inputs.scope != 'go'
    outputs:
      shards: ${{ steps.enumerate.outputs.shards }}
      count: ${{ steps.enumerate.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Enumerate shards
        id: enumerate
        working-directory: frontend
        run: |
          set -euo pipefail
          out=$(python3 scripts/mutation_shards.py surface)
          echo "shards=$(echo "$out" | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["shards"]))')" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$out" | python3 -c 'import json,sys; print(json.load(sys.stdin)["count"])')" >> "$GITHUB_OUTPUT"
          echo "$out" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("%d shards" % d["count"])'

  frontend-surface-mutation:
    name: Frontend - surface (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: frontend-surface-matrix
    if: github.event_name == 'schedule' || inputs.scope != 'go'
    # One instrumented file, so this is minutes rather than hours, and still far
    # below GitHub's 6h cap so our own timeout fires first and the missing report
    # reds the aggregate loudly.
    #
    # 120 rather than 60 because loop density, not file size, sets a shard's
    # cost. Run 31395038245 measured this: puzzleEncoding.ts (600 lines, 424
    # mutants) finished in ~8 minutes, while useCandidates.ts (237 lines, 16
    # nested loops over the board) blew past 60 despite a test suite that runs
    # in 486ms. Mutating a loop bound or increment produces a non-terminating
    # mutant that costs the full Stryker timeout before it can be scored, so the
    # wall-clock is dominated by timeouts rather than by work. Those mutants are
    # still counted as caught; they are simply expensive to reach.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.frontend-surface-matrix.outputs.shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # continue-on-error here, unlike an unsharded run, because the aggregate
      # below is this scope's gate: a single shard under its own break threshold
      # must not stop the other 57 from being measured. A shard that produces no
      # report still fails loudly, at the upload step and again at the aggregate.
      - name: Run StrykerJS on ${{ matrix.file }}
        working-directory: frontend
        run: npx stryker run --mutate "${{ matrix.file }}"
        continue-on-error: true

      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-frontend-surface-${{ matrix.name }}
          path: frontend/reports/mutation/mutation.json
          retention-days: 30
          if-no-files-found: error

  # Combines the per-file reports into one efficacy number, exactly as a single
  # unsharded run would have. --expected is the enumerated shard count rather
  # than a literal, so a shard that never ran cannot masquerade as a complete
  # result: a missing report exits 2.
  frontend-surface-aggregate:
    name: Frontend - surface (aggregate gate)
    runs-on: ubuntu-latest
    needs: [frontend-surface-matrix, frontend-surface-mutation]
    if: always() && (github.event_name == 'schedule' || inputs.scope != 'go')
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Download all surface shard reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mutation-frontend-surface-*
          path: shards

      # Floor 97, raised from 0 on the first complete measurement this scope has
      # ever had. Two runs corroborate it and agree to the mutant: nightly
      # 32331041489 and dispatch 32420620093 both reported
      # 97.7% [shards=63 caught=4844 escaped=114 ignored=690 total=5648].
      # Before those, the shard count was 62 of 63 because hooks-useCandidates
      # never finished its initial test run; 567c9fe fixed the render loop that
      # caused it, which is what made a whole-surface number possible at all.
      #
      # 97 rather than 97.7 for one mechanical reason: this gate prints the floor
      # with :.0f, so a fractional floor would report itself as "floor 98%" and
      # read as stricter than it is. The 0.7 point of headroom is ~35 mutants.
      # Per the ratchet in api/mutation-floors.json, this only ever rises, and it
      # rises by measuring rather than by editing the number.
      - name: Aggregate efficacy gate
        working-directory: frontend
        run: |
          python3 scripts/mutation_aggregate.py \
            --floor 97 --expected "${{ needs.frontend-surface-matrix.outputs.count }}" \
            --reports-dir ../shards \
            --label "frontend/surface (MUT-8-3)"

  # The 7 CODE-6 extracted hooks were deferred from QUAL-2's mutation lockdown
  # because the 893-mutant unsharded run is impractical in-session (~8h). This
  # matrix runs one shard per hook, mirroring the Go techniques sharding pattern
  # (INFRA-4): public repo = free hosted minutes, so fine-grained sharding costs
  # nothing and eliminates the 6h-cap timeout that hid the results under the
  # unsharded run. The aggregate job below combines the per-shard reports and
  # gates the combined efficacy against the floor.
  frontend-hooks-mutation:
    name: Frontend - hooks (${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: [changes-since-last-run]
    if: needs.changes-since-last-run.outputs.should-run == 'true'
    if: github.event_name == 'schedule' || inputs.scope != 'go'
    # Below GitHub's hard 6h cap so our timeout fires first; a timed-out shard's
    # report goes missing and the aggregate gate fails loudly (exit 2) rather
    # than reporting a partial number as if it were complete.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: useGameActions
          - shard: useGameInput
          - shard: useHints
          - shard: useShareActions
          - shard: useAutoSolveAdapters
          - shard: useInProgressGameCheck
          - shard: useDeselectOnOutsideClick
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run StrykerJS on ${{ matrix.shard }}
        working-directory: frontend
        run: npx stryker run --mutate "src/hooks/${{ matrix.shard }}.ts"
        continue-on-error: true

      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-frontend-hooks-${{ matrix.shard }}
          path: frontend/reports/mutation/mutation.json
          retention-days: 30
          # error, not warn: a shard that produced no report should fail here,
          # at the shard that lost it, rather than one layer later as an
          # --expected shortfall in the aggregate that has to infer which.
          if-no-files-found: error

  # Combine the 7 per-hook shard reports into one efficacy number and gate it,
  # exactly as a single unsharded run would. Fails loudly (exit 2) if any shard
  # report is missing so a timed-out shard cannot masquerade as a passing
  # partial result. Mirrors the Go techniques-aggregate job.
  frontend-hooks-aggregate:
    name: Frontend - hooks (aggregate gate)
    runs-on: ubuntu-latest
    needs: frontend-hooks-mutation
    if: always() && (github.event_name == 'schedule' || inputs.scope != 'go')
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Download all hooks shard reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mutation-frontend-hooks-*
          path: shards

      - name: Aggregate efficacy gate
        working-directory: frontend
        run: |
          python3 scripts/mutation_aggregate.py \
            --floor 100 --expected 7 --reports-dir ../shards \
            --label "frontend/hooks (CODE-6)"

  go-mutation:
    name: Go - ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [changes-since-last-run]
    if: needs.changes-since-last-run.outputs.should-run == 'true'
    if: github.event_name == 'schedule' || inputs.scope != 'frontend'
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # No floor here: the gate step reads api/mutation-floors.json, which
          # is the single source of truth the Makefile also reads (MUT-6-1).
          # This list must match PACKAGE_PKGS in api/scripts/mutation_floors.py
          # minus `techniques`, which is sharded by the job below; a test in
          # api/scripts/mutation_floors_test.py enforces that.
          #
          # The four small packages carry a 60-minute cap rather than dp and
          # human's 360: their suites run in well under a second and their
          # whole surface is 180 mutants between them, so an hour is already
          # several times the observed cost.
          - name: config
            pkg: ./pkg/config
            timeout: 60
          - name: constants
            pkg: ./pkg/constants
            timeout: 60
          - name: puzzles
            pkg: ./internal/puzzles
            timeout: 60
          - name: diagnosis
            pkg: ./internal/sudoku/diagnosis
            timeout: 60
          - name: dp
            pkg: ./internal/sudoku/dp
            timeout: 360
          - name: human
            pkg: ./internal/sudoku/human
            timeout: 360
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Install go-mutesting
        working-directory: api
        run: make mutation-install

      - name: Run go-mutesting on ${{ matrix.pkg }}
        working-directory: api
        run: |
          mkdir -p reports/mutation
          cat > /tmp/mutation-config.yml <<'YAML'
          json_output: true
          YAML
          # Ask for the destination rather than deriving it, so the producer and
          # the gate that reads it cannot disagree about the path.
          dest=$(python3 scripts/mutation_floors.py report-path \
            --package-dir reports/mutation --scope "${{ matrix.name }}")
          mkdir -p "$(dirname "$dest")"
          # The cap below kills a runaway mutant, and go-mutesting scores that
          # exactly as it scores an assertion failure: one exit code, and the
          # test output discarded. The --exec wrapper is the last place that
          # output exists, so it classifies each kill and writes the verdict
          # next to the report, inside the directory already uploaded. It also
          # carries the two things go-mutesting does not apply on the exec path,
          # the compile probe and the per-mutant timeout; see the header of
          # tools/mutation/ci-exec.sh, and the same-code control in
          # tools/mutation/README.md that shows no score moved.
          export MUTATION_AUDIT_LOG="$PWD/$(dirname "$dest")/audit.log"
          ulimit -v "$MUTATION_ADDRESS_SPACE_KB"
          go-mutesting --exec-timeout "$MUTATION_EXEC_TIMEOUT" \
            --exec="$GITHUB_WORKSPACE/tools/mutation/ci-exec.sh" \
            --config=/tmp/mutation-config.yml ${{ matrix.pkg }}
          mv report.json "$dest" 2>/dev/null || true
          ../tools/mutation/audit-summary.sh "${{ matrix.name }}" \
            "$MUTATION_AUDIT_LOG" >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true

      # Floor and efficacy arithmetic both live in scripts/mutation_floors.py,
      # which `make mutation-gate` also calls, so a local run and this job cannot
      # reach different verdicts on the same report. A missing report exits 2
      # (untrustworthy) rather than passing as an unmeasured scope.
      - name: Check efficacy gate
        working-directory: api
        run: |
          python3 scripts/mutation_floors.py gate-package \
            --package-dir reports/mutation --scope "${{ matrix.name }}"

      - name: Upload Go mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-go-${{ matrix.name }}
          path: api/reports/mutation/
          retention-days: 30
          if-no-files-found: warn

  # Techniques is the largest package (~7700 LOC across 22 files) and cannot be
  # mutated within GitHub Actions' hard 6h (360m) per-job limit in one run
  # (~10-12h at ~27s per mutant). It is sharded ONE FILE PER SHARD across a
  # matrix: each shard mutates a single technique file, finishing in minutes,
  # trivially under the cap and with no bin-packing to maintain. This repo is
  # public, so GitHub-hosted Actions minutes are free and unlimited: fine-grained
  # sharding costs nothing. go-mutesting mutates only the targeted file but
  # type-checks against the whole package, so a single file is a valid,
  # self-contained target. A dependent aggregate job combines the per-shard
  # reports into one efficacy number and enforces the floor.
  #
  # One matrix entry per non-test *.go file in the techniques package. When a
  # technique file is added or removed, add/remove its entry here and its floor
  # entry in api/mutation-floors.json; the expected shard count is derived from
  # that file, and a test asserts the two lists agree.
  techniques-mutation:
    name: Go - techniques (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: [changes-since-last-run]
    if: needs.changes-since-last-run.outputs.should-run == 'true'
    if: github.event_name == 'schedule' || inputs.scope != 'frontend'
    # Below GitHub's hard 6h (360m) cap so our timeout fires first in the
    # unlikely event a single file runs long; that shard's report goes missing
    # and the aggregate gate fails loudly rather than reporting a partial number.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: aic
            files: "aic.go"
          - shard: als_chains
            files: "als_chains.go"
          - shard: blossom
            files: "blossom.go"
          - shard: board
            files: "board.go"
          - shard: bug
            files: "bug.go"
          - shard: chains
            files: "chains.go"
          - shard: digit_forcing
            files: "digit_forcing.go"
          - shard: fish
            files: "fish.go"
          - shard: forcing
            files: "forcing.go"
          - shard: formatter
            files: "formatter.go"
          - shard: grid
            files: "grid.go"
          - shard: medusa
            files: "medusa.go"
          - shard: pairs
            files: "pairs.go"
          - shard: sdc
            files: "sdc.go"
          - shard: simple
            files: "simple.go"
          - shard: skyscraper
            files: "skyscraper.go"
          - shard: swordfish
            files: "swordfish.go"
          - shard: triples
            files: "triples.go"
          - shard: ur
            files: "ur.go"
          - shard: wings
            files: "wings.go"
          - shard: xcycles
            files: "xcycles.go"
          - shard: xwing_finned
            files: "xwing_finned.go"
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Install go-mutesting
        working-directory: api
        run: make mutation-install

      - name: Run go-mutesting on techniques shard ${{ matrix.shard }}
        working-directory: api
        shell: bash
        run: |
          outdir="reports/mutation/techniques-shard-${{ matrix.shard }}"
          mkdir -p "$outdir"
          cat > /tmp/mutation-config.yml <<'YAML'
          json_output: true
          YAML
          targets=()
          for f in ${{ matrix.files }}; do
            targets+=("./internal/sudoku/human/techniques/$f")
          done
          # Records why each mutant died, so a kill the address-space cap
          # produced can be told from one a test earned. Same wrapper, same
          # reasoning and same caveats as the go-mutation job above; the
          # per-shard log rides along inside this shard's report directory.
          export MUTATION_AUDIT_LOG="$PWD/$outdir/audit.log"
          ulimit -v "$MUTATION_ADDRESS_SPACE_KB"
          go-mutesting --exec-timeout "$MUTATION_EXEC_TIMEOUT" \
            --exec="$GITHUB_WORKSPACE/tools/mutation/ci-exec.sh" \
            --config=/tmp/mutation-config.yml "${targets[@]}"
          mv report.json "$outdir/" 2>/dev/null || true
          ../tools/mutation/audit-summary.sh "techniques/${{ matrix.shard }}" \
            "$MUTATION_AUDIT_LOG" >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true

      - name: Upload techniques shard report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-go-techniques-shard-${{ matrix.shard }}
          path: api/reports/mutation/
          retention-days: 30
          if-no-files-found: warn

  # Gate each techniques shard against its own floor, then the whole package
  # against the aggregate floor, both read from api/mutation-floors.json. Fails
  # loudly (in-log) if any shard report is missing so a timed-out shard cannot
  # masquerade as a passing partial result.
  #
  # Per-shard floors are what let the MUT-6 campaign hold ground it has taken. A
  # closed shard is a few dozen mutants against a package denominator in the
  # thousands, so a full regression of one shard moves the aggregate by a
  # fraction of a point and an aggregate-only gate absorbs it silently.
  techniques-aggregate:
    name: Go - techniques (aggregate gate)
    runs-on: ubuntu-latest
    needs: techniques-mutation
    if: always() && (github.event_name == 'schedule' || inputs.scope != 'frontend')
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Download all techniques shard reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mutation-go-techniques-shard-*
          path: shards

      # The expected shard count comes from the floors file's shard map rather
      # than a literal here, so adding a technique file means adding one entry
      # in one place instead of keeping a matrix and an --expected count in step.
      - name: Per-shard and aggregate efficacy gate
        working-directory: api
        run: |
          python3 scripts/mutation_floors.py gate-shards --shards-dir ../shards

  # The floors only rise when somebody runs `make mutation-ratchet` by hand, and
  # for the whole of the MUT-6 campaign nobody did: all 22 shard floors sat unset
  # while nine shards had already been driven to zero escapes, so a regression
  # inside any of them would have failed nothing. This job makes that drift
  # impossible to miss.
  #
  # It detects; it does not act. Raising a floor from CI would be a quality gate
  # moving its own bar unattended, and it would need a write token this
  # repository grants no workflow. The fix is one documented command, and the
  # exact diff to commit is printed into the run summary.
  #
  # It runs here rather than on a pull request because only inside this run do
  # the measurement and the code it describes belong together: on a pull request
  # the newest available artifacts measure something else.
  floors-lag-check:
    name: Go - mutation floors lag check
    runs-on: ubuntu-latest
    needs: [go-mutation, techniques-aggregate]
    if: always() && (github.event_name == 'schedule' || inputs.scope != 'frontend')
    permissions:
      contents: read
      # Reading another run's artifacts, to corroborate a raise against the
      # previous measurement rather than trusting one reading.
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Download this run's package reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mutation-go-@(dp|human)
          path: pkgs
          merge-multiple: true

      - name: Download this run's shard reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mutation-go-techniques-shard-*
          path: shards

      # A floor raised onto a single run's number reds the gate on unchanged
      # code if that number drifts down next time. Every raise this job proposes
      # is therefore the lower of this run and the last one that produced
      # reports. When there is no previous run to compare against, the check
      # still runs, uncorroborated: that makes it stricter rather than weaker,
      # which is the safe direction for a detector.
      - name: Resolve the previous run of this workflow
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list --repo "$GITHUB_REPOSITORY" \
                 --workflow "${{ github.workflow }}" --status success --limit 10 \
                 --json databaseId \
                 --jq "[.[] | select(.databaseId != ${{ github.run_id }})][0].databaseId // empty")
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "previous run: ${id:-none found}"

      - name: Download the previous run's package reports
        if: steps.previous.outputs.id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mutation-go-@(dp|human)
          path: prev-pkgs
          merge-multiple: true
          run-id: ${{ steps.previous.outputs.id }}
          github-token: ${{ github.token }}

      - name: Download the previous run's shard reports
        if: steps.previous.outputs.id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mutation-go-techniques-shard-*
          path: prev-shards
          run-id: ${{ steps.previous.outputs.id }}
          github-token: ${{ github.token }}

      - name: Fail if the floors lag this measurement
        working-directory: api
        run: |
          set -euo pipefail
          corroborate=""
          if [ -d ../prev-pkgs ]; then
            corroborate="$corroborate --previous-package-dir ../prev-pkgs"
          fi
          if [ -d ../prev-shards ]; then
            corroborate="$corroborate --previous-shards-dir ../prev-shards"
          fi
          if [ -z "$corroborate" ]; then
            echo "::notice::no previous run's reports available; checking against this run alone"
          fi

          # shellcheck disable=SC2086 # the flags are built above and must split
          python3 scripts/mutation_floors.py propose \
            --package-dir ../pkgs --shards-dir ../shards $corroborate \
            --run "$GITHUB_RUN_ID" --in-place

          if git diff --quiet -- mutation-floors.json; then
            echo "floors are level with the measurement" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## Mutation floors lag this run"
            echo
            echo "Every number below is a floor that has been earned and is not"
            echo "being enforced. Raise them with:"
            echo
            echo '```'
            echo "make mutation-ratchet SHARDS_DIR=<downloaded shards> RUN=$GITHUB_RUN_ID"
            echo '```'
            echo
            echo '```diff'
            git diff -- mutation-floors.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::mutation floors lag this run's measurement; see the run summary for the diff"
          git --no-pager diff -- mutation-floors.json
          exit 1
