name: Mutation Testing

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Which scope to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - frontend
          - go
  schedule:
    # 04:00 UTC daily (one hour after nightly-profiling at 03:00 to avoid contention).
    # Re-enabled: ARCH-2 quarantined transport/http and coverage/mutation baselines are green.
    - cron: '0 4 * * *'

permissions:
  contents: read

concurrency:
  group: mutation-testing
  cancel-in-progress: false

env:
  CI: true

jobs:
  frontend-mutation:
    name: Frontend (StrykerJS)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || inputs.scope != 'go'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run StrykerJS
        working-directory: frontend
        run: npx stryker run
        continue-on-error: true

      - name: Upload frontend mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-frontend
          path: |
            frontend/reports/mutation/
            frontend/mutation.json
          retention-days: 30
          if-no-files-found: warn

  go-mutation:
    name: Go - ${{ matrix.name }}
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || inputs.scope != 'frontend'
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dp
            pkg: ./internal/sudoku/dp
            floor: 98
            timeout: 360
          - name: human
            pkg: ./internal/sudoku/human
            floor: 95
            timeout: 360
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Install go-mutesting
        working-directory: api
        run: make mutation-install

      - name: Run go-mutesting on ${{ matrix.pkg }}
        working-directory: api
        run: |
          mkdir -p reports/mutation
          cat > /tmp/mutation-config.yml <<'YAML'
          json_output: true
          YAML
          go-mutesting --config=/tmp/mutation-config.yml ${{ matrix.pkg }}
          slug=$(echo "${{ matrix.pkg }}" | tr -d './' | tr '/' '-')
          mkdir -p "reports/mutation/${slug}"
          mv report.json "reports/mutation/${slug}/" 2>/dev/null || true
        continue-on-error: true

      - name: Check efficacy gate
        working-directory: api
        run: |
          slug=$(echo "${{ matrix.pkg }}" | tr -d './' | tr '/' '-')
          report="reports/mutation/${slug}/report.json"
          if [ ! -f "$report" ]; then
            echo "mutation-gate: FAIL ${{ matrix.pkg }} no report (run errored or timed out; efficacy unmeasured)" >&2
            exit 1
          fi
          python3 -c "
          import json, sys
          with open('$report') as f:
              r = json.load(f)
          s = r['stats']
          killed = s['killedCount'] + s.get('timeOutCount', 0)
          escaped = s['escapedCount']
          denom = killed + escaped
          eff = killed / denom * 100 if denom > 0 else 100
          floor = ${{ matrix.floor }}
          status = 'OK' if eff >= floor else 'FAIL'
          print(f'mutation-gate: {status} ${{ matrix.pkg }} {eff:.1f}% (floor {floor}%) [killed={killed} escaped={escaped} total={s[\"totalMutantsCount\"]}]')
          sys.exit(0 if eff >= floor else 1)
          "

      - name: Upload Go mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-go-${{ matrix.name }}
          path: api/reports/mutation/
          retention-days: 30
          if-no-files-found: warn

  # Techniques is the largest package (~7700 LOC across 22 files) and cannot be
  # mutated within GitHub Actions' hard 6h (360m) per-job limit in one run
  # (~10-12h at ~27s per mutant). It is sharded ONE FILE PER SHARD across a
  # matrix: each shard mutates a single technique file, finishing in minutes,
  # trivially under the cap and with no bin-packing to maintain. This repo is
  # public, so GitHub-hosted Actions minutes are free and unlimited: fine-grained
  # sharding costs nothing. go-mutesting mutates only the targeted file but
  # type-checks against the whole package, so a single file is a valid,
  # self-contained target. A dependent aggregate job combines the per-shard
  # reports into one efficacy number and enforces the floor.
  #
  # One matrix entry per non-test *.go file in the techniques package. When a
  # technique file is added or removed, add/remove its entry and update the
  # aggregate's --expected to match the shard count.
  techniques-mutation:
    name: Go - techniques (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || inputs.scope != 'frontend'
    # Below GitHub's hard 6h (360m) cap so our timeout fires first in the
    # unlikely event a single file runs long; that shard's report goes missing
    # and the aggregate gate fails loudly rather than reporting a partial number.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: aic
            files: "aic.go"
          - shard: als_chains
            files: "als_chains.go"
          - shard: blossom
            files: "blossom.go"
          - shard: board
            files: "board.go"
          - shard: bug
            files: "bug.go"
          - shard: chains
            files: "chains.go"
          - shard: digit_forcing
            files: "digit_forcing.go"
          - shard: fish
            files: "fish.go"
          - shard: forcing
            files: "forcing.go"
          - shard: formatter
            files: "formatter.go"
          - shard: grid
            files: "grid.go"
          - shard: medusa
            files: "medusa.go"
          - shard: pairs
            files: "pairs.go"
          - shard: sdc
            files: "sdc.go"
          - shard: simple
            files: "simple.go"
          - shard: skyscraper
            files: "skyscraper.go"
          - shard: swordfish
            files: "swordfish.go"
          - shard: triples
            files: "triples.go"
          - shard: ur
            files: "ur.go"
          - shard: wings
            files: "wings.go"
          - shard: xcycles
            files: "xcycles.go"
          - shard: xwing_finned
            files: "xwing_finned.go"
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Install go-mutesting
        working-directory: api
        run: make mutation-install

      - name: Run go-mutesting on techniques shard ${{ matrix.shard }}
        working-directory: api
        shell: bash
        run: |
          outdir="reports/mutation/techniques-shard-${{ matrix.shard }}"
          mkdir -p "$outdir"
          cat > /tmp/mutation-config.yml <<'YAML'
          json_output: true
          YAML
          targets=()
          for f in ${{ matrix.files }}; do
            targets+=("./internal/sudoku/human/techniques/$f")
          done
          go-mutesting --config=/tmp/mutation-config.yml "${targets[@]}"
          mv report.json "$outdir/" 2>/dev/null || true
        continue-on-error: true

      - name: Upload techniques shard report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-go-techniques-shard-${{ matrix.shard }}
          path: api/reports/mutation/
          retention-days: 30
          if-no-files-found: warn

  # Combine the per-shard techniques reports into one efficacy number and gate
  # it against the floor, exactly as a single unsharded run would. Fails loudly
  # (in-log) if any shard report is missing so a timed-out shard cannot masquerade
  # as a passing partial result.
  techniques-aggregate:
    name: Go - techniques (aggregate gate)
    runs-on: ubuntu-latest
    needs: techniques-mutation
    if: always() && (github.event_name == 'schedule' || inputs.scope != 'frontend')
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Download all techniques shard reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mutation-go-techniques-shard-*
          path: shards

      - name: Aggregate efficacy gate
        working-directory: api
        run: |
          python3 scripts/mutation_aggregate.py \
            --floor 95 --expected 22 --reports-dir ../shards
