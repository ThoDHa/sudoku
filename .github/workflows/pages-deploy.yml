name: Deploy Pages

# Decoupled deploy. It runs only after "Test & Build" finishes and consumes the
# `pages-site` artifact that run produced. Splitting deploy out of the test
# workflow means a superseding push can cancel redundant test work (via the test
# workflow's cancel-in-progress) without ever cancelling an in-flight deploy:
# this workflow's concurrency queues deploys instead of cancelling them.
on:
  workflow_run:
    workflows: ["Test & Build"]
    types: [completed]

permissions:
  contents: read
  actions: read      # read/download artifacts from the triggering run
  pages: write
  id-token: write

# Serialize deploys to the single Pages environment and never cancel one that is
# already running. A queued deploy waits its turn rather than clobbering or being
# clobbered.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Only consider runs that completed successfully. A run that produced no
    # deployable site (wrong branch, failed tests, E2E over threshold) simply
    # uploaded no `pages-site` artifact, and the check step below skips the deploy.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Artifact presence is the deploy signal set by the Test & Build gate.
      # When absent, this run is not deployable and every step below is skipped.
      - name: Check for site artifact
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api \
            "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/artifacts" \
            --jq '[.artifacts[] | select(.name == "pages-site")] | length')
          if [ "$count" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Found pages-site artifact; proceeding to deploy."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No pages-site artifact for run ${{ github.event.workflow_run.id }} (branch ${{ github.event.workflow_run.head_branch }}); nothing to deploy."
          fi

      - name: Download site from triggering run
        if: steps.check.outputs.found == 'true'
        uses: actions/download-artifact@v8
        with:
          name: pages-site
          path: pages-site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # deploy-pages consumes an artifact named "github-pages" in this run, so
      # re-wrap the downloaded site with upload-pages-artifact before deploying.
      - name: Package as Pages artifact
        if: steps.check.outputs.found == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.check.outputs.found == 'true'
        uses: actions/deploy-pages@v5
