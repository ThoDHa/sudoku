name: Test & Deploy

on:
  push:
    branches:
      - main
      - modernization
  pull_request:
    branches:
      - main
      - modernization
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Which tests to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - unit
          - go
          - e2e

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "deploy-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # ============================================
  # Frontend Unit Tests (Vitest)
  # ============================================
  test-frontend-unit:
    if: ${{ github.event.inputs.test_suite == 'all' || github.event.inputs.test_suite == 'unit' || github.event.inputs.test_suite == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run linting
        working-directory: frontend
        run: npm run lint

      - name: Run unit tests
        working-directory: frontend
        run: npm run test:coverage

      - name: Run jscpd duplication check
        working-directory: frontend
        run: npm run dup-check

      - name: Generate environment properties
        working-directory: frontend
        run: |
          echo "node.version=$(node --version)" >> allure-results/environment.properties
          echo "npm.version=$(npm --version)" >> allure-results/environment.properties
          echo "os=$(uname -s)" >> allure-results/environment.properties
          echo "arch=$(uname -m)" >> allure-results/environment.properties
          echo "commit=${{ github.sha }}" >> allure-results/environment.properties
          echo "branch=${{ github.ref_name }}" >> allure-results/environment.properties
          echo "test.type=unit" >> allure-results/environment.properties

      - name: Upload Allure results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-results-unit
          path: frontend/allure-results/
          retention-days: 30

      # Vitest coverage HTML (produced by test:coverage) for the report portal.
      - name: Upload frontend coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-frontend
          path: frontend/coverage/
          retention-days: 30
          if-no-files-found: warn

  # ============================================
  # Go Tests
  # ============================================
  test-go:
    if: ${{ github.event.inputs.test_suite == 'all' || github.event.inputs.test_suite == 'go' || github.event.inputs.test_suite == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: api/go.sum

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run Go linter
        working-directory: api
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          golangci-lint run ./...

      - name: Run govulncheck
        working-directory: api
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
          make vulncheck

      - name: Run Go tests with JUnit output
        working-directory: api
        run: |
          mkdir -p allure-results
          gotestsum --junitfile allure-results/go-results.xml --format testname \
            -- -v -coverprofile=coverage.out -covermode=atomic ./...

      - name: Generate Go coverage HTML
        working-directory: api
        if: always()
        run: |
          # Reuse the profile from the test run above (no second test pass)
          go tool cover -html=coverage.out -o coverage.html || echo "no coverage profile"

      - name: Upload Go coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-go
          path: api/coverage.html
          retention-days: 30
          if-no-files-found: warn

      - name: Run Go coverage gate
        working-directory: api
        run: make coverage-gate

      - name: Generate environment properties
        working-directory: api
        run: |
          echo "go.version=$(go version | awk '{print $3}')" >> allure-results/environment.properties
          echo "os=$(uname -s)" >> allure-results/environment.properties
          echo "arch=$(uname -m)" >> allure-results/environment.properties
          echo "commit=${{ github.sha }}" >> allure-results/environment.properties
          echo "branch=${{ github.ref_name }}" >> allure-results/environment.properties
          echo "run.url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> allure-results/environment.properties

      - name: Upload Allure results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-results-go
          path: api/allure-results/
          retention-days: 30

  # ============================================
  # E2E Tests (Playwright) - docker-compose based
  # ============================================
  test-e2e:
    if: ${{ github.event.inputs.test_suite == 'all' || github.event.inputs.test_suite == 'e2e' || github.event.inputs.test_suite == '' }}
    runs-on: ubuntu-latest
    # E2E is tolerated via a failure threshold in the deploy gate (not all-or-nothing).
    # continue-on-error keeps a failed E2E run from blocking downstream jobs; the
    # failure count is exported for the deploy job to gate on.
    continue-on-error: true
    outputs:
      e2e_failures: ${{ steps.e2e-summary.outputs.failures }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker buildx
        uses: actions/setup-buildx-action@v4

      - name: Show Docker Compose version
        run: docker compose version

      - name: Run E2E tests via docker-compose
        run: |
          # Run docker-compose E2E flow. This will build sudoku image (which includes WASM),
          # start services, run playwright container, and exit with playwright service exit code.
          # tee the output so the failure-count parser can read Playwright's summary; `|| true`
          # lets the step complete (the job is continue-on-error anyway) and the count gates deploy.
          docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from playwright 2>&1 | tee /tmp/e2e.log || true
        env:
          CI: true

      - name: Parse E2E failure count
        id: e2e-summary
        if: always()
        run: |
          # Playwright prints a summary line like "  3 failed, 497 passed".
          failures=$(grep -oE '[0-9]+ failed' /tmp/e2e.log | head -1 | grep -oE '^[0-9]+' || true)
          failures="${failures:-0}"
          echo "failures=$failures" >> "$GITHUB_OUTPUT"
          echo "E2E failures: $failures"

      - name: Upload Playwright test-results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Upload Allure results (if present)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-results-e2e
          path: frontend/allure-results/
          retention-days: 30

  # ============================================
  # Generate Allure Report
  # ============================================
  allure-report:
    runs-on: ubuntu-latest
    needs: [test-frontend-unit, test-go, test-e2e]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Download all Allure results
        uses: actions/download-artifact@v8
        continue-on-error: false
        with:
          pattern: allure-results-*
          path: allure-results-all
          merge-multiple: false

      - name: Verify results downloaded
        run: |
          echo "=== Checking downloaded artifacts ==="
          echo "allure-results-all contents:"
          ls -laR allure-results-all || echo "Directory empty"

      # Best-effort: pull the latest successful nightly runs so (a) their Allure
      # results fold into the one combined report and (b) the portal can link the
      # mutation and profiling reports. These live in separate workflows'
      # artifacts. If a run does not exist yet or a download fails, the combined
      # Allure and the portal simply omit those pieces; the deploy is unaffected.
      - name: Fetch latest nightly reports
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/modernization'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p nightly-artifacts
          for wf in nightly-mutation.yml nightly-profiling.yml; do
            run_id=$(gh run list --workflow="$wf" --status=success \
              --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$run_id" ]; then
              echo "Downloading artifacts from $wf run $run_id"
              gh run download "$run_id" --dir nightly-artifacts \
                || echo "download failed for $wf; its reports will be omitted"
            else
              echo "No successful $wf run found; its reports will be omitted"
            fi
          done

      # Coverage reports are produced by this run's own test jobs; pull them into
      # the same dir so the portal links them alongside the nightly reports.
      - name: Download coverage reports
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/modernization'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: nightly-artifacts

      - name: Merge Allure results
        run: |
          mkdir -p allure-results

          echo "=== Step 1: Copy all result files ==="
          # Copy files from each suite
          cp -r allure-results-all/allure-results-unit/* allure-results/ 2>/dev/null || true
          cp -r allure-results-all/allure-results-go/* allure-results/ 2>/dev/null || true
          cp -r allure-results-all/allure-results-e2e/* allure-results/ 2>/dev/null || true
          # One combined Allure: fold in the latest nightly profiling suite results
          cp -r nightly-artifacts/nightly-allure-results/* allure-results/ 2>/dev/null || true

          echo "Files copied from each suite:"
          ls -la allure-results/

          echo ""
          echo "=== Step 2: Merge environment.properties ==="
          # Merge environment.properties from all test suites instead of overwriting
          # Each suite (unit, go, e2e) has its own environment.properties
          echo "=== Merged environment properties from all test suites ===" > allure-results/environment.properties

          if [ -f "allure-results-all/allure-results-unit/environment.properties" ]; then
            echo "" >> allure-results/environment.properties
            echo "=== Unit Tests ===" >> allure-results/environment.properties
            cat allure-results-all/allure-results-unit/environment.properties >> allure-results/environment.properties
          fi

          if [ -f "allure-results-all/allure-results-go/environment.properties" ]; then
            echo "" >> allure-results/environment.properties
            echo "=== Go Tests ===" >> allure-results/environment.properties
            cat allure-results-all/allure-results-go/environment.properties >> allure-results/environment.properties
          fi

          if [ -f "allure-results-all/allure-results-e2e/environment.properties" ]; then
            echo "" >> allure-results/environment.properties
            echo "=== E2E Tests ===" >> allure-results/environment.properties
            cat allure-results-all/allure-results-e2e/environment.properties >> allure-results/environment.properties
          fi

          if [ -f "nightly-artifacts/nightly-allure-results/environment.properties" ]; then
            echo "" >> allure-results/environment.properties
            echo "=== Nightly Profiling ===" >> allure-results/environment.properties
            cat nightly-artifacts/nightly-allure-results/environment.properties >> allure-results/environment.properties
          fi

          # Copy categories.json from frontend for failure classification
          if [ -f "frontend/.allure/categories.json" ]; then
            cp frontend/.allure/categories.json allure-results/
            echo "Copied categories.json for failure classification"
          fi

          echo ""
          echo "=== Final merged environment.properties ==="
          cat allure-results/environment.properties

          echo ""
          echo "=== All files in allure-results ==="
          ls -la allure-results/

      # Surface mutation efficacy inside the combined Allure: one test per
      # mutated file (passed if all its mutants were killed, failed if any
      # survived). The rich per-mutant diffs stay in the native mutation HTML
      # linked from the portal. Isolated so it can never break Allure generation.
      - name: Add mutation results to Allure
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/modernization'
        continue-on-error: true
        run: |
          python3 .github/scripts/mutation_to_allure.py \
            --out-dir allure-results \
            --artifacts-dir nightly-artifacts

      - name: Download previous Allure history
        run: |
          # Find the most recent completed run with allure-history artifact
          PREVIOUS_RUN=$(gh run list --workflow=deploy.yml --status=completed --limit 5 --json databaseId -q '.[0].databaseId' 2>/dev/null || echo "")
          
          if [ -n "$PREVIOUS_RUN" ] && [ "$PREVIOUS_RUN" != "${{ github.run_id }}" ]; then
            if gh run download "$PREVIOUS_RUN" --name allure-history --dir allure-history 2>/dev/null; then
              echo "Downloaded allure-history from run $PREVIOUS_RUN"
            else
              echo "No allure-history artifact in previous run - starting fresh"
              mkdir -p allure-history
            fi
          else
            echo "No previous run found - starting fresh"
            mkdir -p allure-history
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Copy history to results
        run: |
          if [ -d "allure-history" ]; then
            mkdir -p allure-results/history
            cp -r allure-history/* allure-results/history/ 2>/dev/null || true
          fi

      - name: Generate Allure report
        working-directory: frontend
        run: |
          npx allure generate ../allure-results -o ../allure-report --clean
          
      - name: Prune history to 5 runs (LRU)
        run: |
          if [ -d "allure-report/history" ]; then
            cd allure-report/history
            # Keep only  5 most recent history entries
            ls -t | tail -n +6 | xargs rm -rf 2>/dev/null || true
          fi

      - name: Save Allure history
        uses: actions/upload-artifact@v7
        with:
          name: allure-history
          path: allure-report/history/
          retention-days: 90

      - name: Upload Allure report artifact
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Setup Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/modernization'
        uses: actions/configure-pages@v5

      - name: Setup Go for WASM build
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/modernization'
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: api/go.sum

      # IMPORTANT: TinyGo version must match local development environment (0.41.1)
      # 0.41.1 is the first release supporting Go 1.26 (0.40.1 caps at Go 1.25)
      # Different TinyGo versions produce incompatible WASM binaries
      # See: https://github.com/tinygo-org/tinygo/releases
      - name: Install TinyGo for WASM build
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/modernization'
        run: |
          wget https://github.com/tinygo-org/tinygo/releases/download/v0.41.1/tinygo_0.41.1_amd64.deb
          sudo dpkg -i tinygo_0.41.1_amd64.deb

      - name: Build WASM for deployment
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/modernization'
        working-directory: api
        run: make wasm-all

      - name: Build frontend for deployment
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/modernization'
        working-directory: frontend
        run: npm run build
        env:
          VITE_BASE_PATH: /sudoku/

      - name: Prepare Pages artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/modernization'
        run: |
          # Create directory structure for GitHub Pages
          # Main app goes to root, test report goes to /test-report/
          mkdir -p pages-artifact/test-report
          cp -r allure-report/* pages-artifact/test-report/
          cp -r frontend/dist/* pages-artifact/
          # Copy WASM files from frontend (includes updated wasm_exec.js from build)
          cp frontend/public/wasm_exec.js pages-artifact/
          cp frontend/public/sudoku.wasm pages-artifact/

      # Unified report portal at /reports/ linking Allure + any fetched mutation
      # reports. Isolated and non-fatal so it can never break the app deploy.
      - name: Build unified report portal
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/modernization'
        continue-on-error: true
        run: |
          python3 .github/scripts/gen_report_portal.py \
            --artifacts-dir nightly-artifacts \
            --out-dir pages-artifact/reports \
            --allure-rel ../test-report/

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/modernization'
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-artifact

  # ============================================
  # Deploy to GitHub Pages (Game + Test Report)
  # ============================================
  deploy:
    # Deploy runs on main (production) or modernization (working branch) when the core gates
    # pass (Go + unit tests) AND E2E failures are within tolerance. Not all-or-nothing: a flaky
    # E2E test no longer blocks deploy. E2E_FAILURE_THRESHOLD is the max tolerated E2E failures
    # (currently 5). If test-e2e was skipped, the empty output is treated as "within tolerance".
    if: |
      always() &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/modernization') &&
      needs.test-go.result == 'success' &&
      needs.test-frontend-unit.result == 'success' &&
      (needs.test-e2e.outputs.e2e_failures == '' || needs.test-e2e.outputs.e2e_failures <= 5)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [test-frontend-unit, test-go, test-e2e, allure-report]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4