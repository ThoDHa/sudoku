version: "2"
run:
  tests: true
linters:
  enable:
    - bodyclose
    - goprintffuncname
    - gosec
    - misspell
    - nakedret
    - nolintlint
    - revive
    - staticcheck
    - unconvert
    - whitespace
  settings:
    misspell:
      locale: US
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: indent-error-flow
        - name: errorf
        - name: superfluous-else
        - name: unreachable-code
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Relax strict checks on test files
      - linters:
          - bodyclose
          - errcheck
          - gosec
        path: _test\.go
      # Sudoku human-solving techniques use complex algorithms; relax gosec
      - linters:
          - gosec
        path: internal/sudoku/human/
      # G602 false positives: dp solver accesses board[idx] where idx is always
      # validated in [0, TotalCells-1] before use and board has exactly TotalCells
      # (81) elements. gosec cannot prove the bound statically.
      - linters:
          - gosec
        path: internal/sudoku/dp/
        text: "G602"
    paths:
      # WASM files require GOOS=js GOARCH=wasm build environment which
      # golangci-lint cannot provide. These files are validated by TinyGo build.
      - cmd/wasm
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      # WASM files require GOOS=js GOARCH=wasm build environment
      - cmd/wasm
      - third_party$
      - builtin$
      - examples$
